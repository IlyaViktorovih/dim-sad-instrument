name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate SEO product pages and sitemap
        env:
          SUPABASE_URL: https://rzdqohedzsgcmhcdhlri.supabase.co
          SUPABASE_KEY: sb_publishable_mErWmopCWbRtyq764qh1_A_rZitmXJZ
        run: node scripts/generate-seo-pages.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
          name: github-pages-${{ github.run_id }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}

# Fresh deployment trigger: keep SEO generation and Pages deployment in one clean run.
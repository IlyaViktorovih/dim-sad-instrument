<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмін-панель — Дім Сад Інструмент</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
      color: #222;
    }
    .box {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      background: #fff;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,.10);
    }
    h1 {
      text-align: center;
      margin-top: 0;
    }
    h2 {
      margin-top: 25px;
    }
    input,
    textarea,
    button {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border-radius: 9px;
      font-size: 16px;
    }
    input,
    textarea {
      border: 1px solid #ccc;
      background: #fff;
    }
    textarea {
      min-height: 110px;
      resize: vertical;
    }
    button {
      border: 0;
      background: #16803c;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #10652f;
    }
    .logout {
      background: #d93636;
    }
    .logout:hover {
      background: #b92727;
    }
    .delete {
      background: #d93636;
    }
    .product {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      background: #fafafa;
    }
    .product img {
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 10px;
    }
    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
    }
    .error {
      color: #c00;
      background: #ffe5e5;
    }
    .success {
      color: #08752d;
      background: #e5f8eb;
    }
    .loading {
      text-align: center;
      padding: 20px;
    }
    #admin {
      display: none;
    }
    hr {
      margin: 25px 0;
      border: 0;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <!-- ВХІД -->
  <div class="box" id="loginBox">
    <h1>🔐 Адмін-панель</h1>
    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >
    <input
      id="password"
      type="password"
      placeholder="Пароль"
      autocomplete="current-password"
    >
    <button type="button" id="loginButton">
      Увійти
    </button>
    <div id="loginMessage"></div>
  </div>
  <!-- АДМІНКА -->
  <div class="box" id="admin">
    <h1>🛒 Дім Сад Інструмент</h1>
    <button type="button" class="logout" id="logoutButton">
      Вийти
    </button>
    <hr>
    <h2>➕ Додати товар</h2>
    <input
      id="name"
      type="text"
      placeholder="Назва товару"
    >
    <input
      id="price"
      type="number"
      placeholder="Ціна, грн"
    >
    <textarea
      id="description"
      placeholder="Опис товару"
    ></textarea>
    <input
      id="image"
      type="text"
      placeholder="Посилання на фото"
    >
    <input
      id="category"
      type="text"
      placeholder="Категорія"
    >
    <button type="button" id="addButton">
      ➕ Додати товар
    </button>
    <div id="addMessage"></div>
    <hr>
    <h2>📦 Товари</h2>
    <div id="products">
      <div class="loading">Завантаження...</div>
    </div>
  </div>
<script>
  /* =========================================
     SUPABASE
     ========================================= */
  const SUPABASE_URL =
    "https://rzdqohedzsgcmhcdhlri.supabase.co";
  const SUPABASE_KEY =
    "sb_publishable_mEr-WmopCWb-Rtyq764qh1_A_rZitmXJZ";
  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  /* =========================================
     ЕЛЕМЕНТИ
     ========================================= */
  const loginBox =
    document.getElementById("loginBox");
  const admin =
    document.getElementById("admin");
  const loginButton =
    document.getElementById("loginButton");
  const logoutButton =
    document.getElementById("logoutButton");
  const addButton =
    document.getElementById("addButton");
  const loginMessage =
    document.getElementById("loginMessage");
  const addMessage =
    document.getElementById("addMessage");
  const productsContainer =
    document.getElementById("products");
  /* =========================================
     ПОКАЗ ПОМИЛКИ
     ========================================= */
  function showLoginError(message) {
    loginMessage.className = "message error";
    loginMessage.innerText =
      "❌ " + message;
  }
  function showAddError(message) {
    addMessage.className = "message error";
    addMessage.innerText =
      "❌ " + message;
  }
  function showAddSuccess(message) {
    addMessage.className = "message success";
    addMessage.innerText =
      "✅ " + message;
  }
  /* =========================================
     ВХІД
     ========================================= */
  async function login() {
    loginMessage.innerText = "";
    loginMessage.className = "";
    const email =
      document.getElementById("email").value.trim();
    const password =
      document.getElementById("password").value;
    if (!email || !password) {
      showLoginError(
        "Введи email та пароль."
      );
      return;
    }
    loginButton.disabled = true;
    loginButton.innerText =
      "Вхід...";
    try {
      const { data, error } =
        await db.auth.signInWithPassword({
          email: email,
          password: password
        });
      if (error) {
        showLoginError(
          error.message
        );
        return;
      }
      if (!data.session) {
        showLoginError(
          "Сесію не створено."
        );
        return;
      }
      showAdmin();
    } catch (error) {
      showLoginError(
        error.message ||
        "Невідома помилка."
      );
    } finally {
      loginButton.disabled = false;
      loginButton.innerText =
        "Увійти";
    }
  }
  /* =========================================
     ПОКАЗ АДМІНКИ
     ========================================= */
  function showAdmin() {
    loginBox.style.display =
      "none";
    admin.style.display =
      "block";
    loadProducts();
  }
  /* =========================================
     ВИХІД
     ========================================= */
  async function logout() {
    await db.auth.signOut();
    admin.style.display =
      "none";
    loginBox.style.display =
      "block";
    document.getElementById("password").value =
      "";
  }
  /* =========================================
     ДОДАТИ ТОВАР
     ========================================= */
  async function addProduct() {
    addMessage.innerText = "";
    addMessage.className = "";
    const name =
      document.getElementById("name").value.trim();
    const price =
      Number(
        document.getElementById("price").value
      );
    const description =
      document.getElementById("description").value.trim();
    const image =
      document.getElementById("image").value.trim();
    const category =
      document.getElementById("category").value.trim();
    if (!name) {
      showAddError(
        "Введи назву товару."
      );
      return;
    }
    if (!price || price < 0) {
      showAddError(
        "Введи правильну ціну."
      );
      return;
    }
    addButton.disabled = true;
    addButton.innerText =
      "Додавання...";
    try {
      const { error } =
        await db
          .from("products")
          .insert({
            name: name,
            price: price,
            description: description,
            image: image,
            category: category,
            available: true,
            is_hit: false
          });
      if (error) {
        showAddError(
          error.message
        );
        return;
      }
      showAddSuccess(
        "Товар успішно додано!"
      );
      document.getElementById("name").value =
        "";
      document.getElementById("price").value =
        "";
      document.getElementById("description").value =
        "";
      document.getElementById("image").value =
        "";
      document.getElementById("category").value =
        "";
      loadProducts();
    } catch (error) {
      showAddError(
        error.message ||
        "Помилка додавання."
      );
    } finally {
      addButton.disabled = false;
      addButton.innerText =
        "➕ Додати товар";
    }
  }
  /* =========================================
     ЗАВАНТАЖИТИ ТОВАРИ
     ========================================= */
  async function loadProducts() {
    productsContainer.innerHTML =
      '<div class="loading">Завантаження товарів...</div>';
    const { data, error } =
      await db
        .from("products")
        .select("*")
        .order("id", {
          ascending: false
        });
    if (error) {
      productsContainer.innerHTML =
        '<div class="message error">❌ ' +
        error.message +
        '</div>';
      return;
    }
    if (!data || data.length === 0) {
      productsContainer.innerHTML =
        "<p>Товарів поки немає.</p>";
      return;
    }
    productsContainer.innerHTML = "";
    data.forEach(product => {
      const div =
        document.createElement("div");
      div.className =
        "product";
      let imageHTML = "";
      if (product.image) {
        imageHTML =
          `<img src="${escapeHTML(product.image)}"
                alt="${escapeHTML(product.name)}"
                onerror="this.style.display='none'">`;
      }
      div.innerHTML = `
        <h3>
          ${escapeHTML(product.name)}
        </h3>
        <p>
          💰 <b>${product.price} грн</b>
        </p>
        <p>
          📂 ${escapeHTML(product.category || "Без категорії")}
        </p>
        <p>
          ${escapeHTML(product.description || "")}
        </p>
        ${imageHTML}
        <button
          type="button"
          class="delete"
          onclick="deleteProduct(${product.id})"
        >
          🗑 Видалити
        </button>
      `;
      productsContainer.appendChild(div);
    });
  }
  /* =========================================
     ВИДАЛИТИ ТОВАР
     ========================================= */
  async function deleteProduct(id) {
    const answer =
      confirm(
        "Точно видалити цей товар?"
      );
    if (!answer) {
      return;
    }
    const { error } =
      await db
        .from("products")
        .delete()
        .eq("id", id);
    if (error) {
      alert(
        "❌ Помилка: " +
        error.message
      );
      return;
    }
    loadProducts();
  }
  /* =========================================
     ЗАХИСТ ВІД HTML
     ========================================= */
  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
  /* =========================================
     ПЕРЕВІРКА СЕСІЇ
     ========================================= */
  async function checkSession() {
    const { data, error } =
      await db.auth.getSession();
    if (error) {
      console.error(error);
      return;
    }
    if (data.session) {
      showAdmin();
    } else {
      loginBox.style.display =
        "block";
      admin.style.display =
        "none";
    }
  }
  /* =========================================
     КНОПКИ
     ========================================= */
  loginButton.addEventListener(
    "click",
    login
  );
  logoutButton.addEventListener(
    "click",
    logout
  );
  addButton.addEventListener(
    "click",
    addProduct
  );
  /* Enter для входу */
  document
    .getElementById("password")
    .addEventListener(
      "keydown",
      function(event) {
        if (event.key === "Enter") {
          login();
        }
      }
    );
  /* Запуск */
  checkSession();
</script>
</body>
</html>

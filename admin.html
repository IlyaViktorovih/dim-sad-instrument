<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмін-панель — Дім Сад Інструмент</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f4;
      color: #222;
    }

    header {
      background: #176b38;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #176b38;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #176b38;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #0f542b;
    }

    .danger {
      background: #c62828;
    }

    .danger:hover {
      background: #a51f1f;
    }

    .logout {
      background: #555;
    }

    .product {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    .product h3 {
      margin: 0 0 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #176b38;
    }

    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #f0f0f0;
    }

    .hidden {
      display: none;
    }

    .small {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>🏠 Дім Сад Інструмент</h1>
  <div>Адмін-панель магазину</div>
</header>

<div class="container">

  <!-- ВХІД -->
  <div class="box" id="loginBox">
    <h2>🔐 Вхід адміністратора</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Пароль"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Увійти
    </button>

    <div id="loginStatus" class="status">
      Введи дані адміністратора.
    </div>
  </div>


  <!-- АДМІНКА -->
  <div id="adminPanel" class="hidden">

    <div class="box">
      <h2>👤 Адміністратор</h2>

      <div id="userEmail" class="small"></div>

      <button class="logout" id="logoutButton">
        Вийти
      </button>
    </div>


    <!-- ДОДАВАННЯ ТОВАРУ -->
    <div class="box">

      <h2>➕ Додати товар</h2>

      <input
        type="text"
        id="productName"
        placeholder="Назва товару"
      >

      <input
        type="number"
        id="productPrice"
        placeholder="Ціна, грн"
        min="0"
      >

      <textarea
        id="productDescription"
        placeholder="Опис товару"
      ></textarea>

      <label><b>Фотографії товару</b></label><input type="file" id="productImages" accept="image/*" multiple><div class="small">Можна вибрати одразу кілька фото. Перше буде головним.</div><input type="text" id="productImage" placeholder="Або посилання на головне фото">

      <select id="productCategory">
        <option value="Для дому">Для дому</option>
        <option value="Для саду">Для саду</option>
        <option value="Інструменти">Інструменти</option>
        <option value="Корисні товари">Корисні товари</option>
      </select>

      <select id="productAvailable">
        <option value="true">Є в наявності</option>
        <option value="false">Немає в наявності</option>
      </select>

      <select id="productHit">
        <option value="false">Звичайний товар</option>
        <option value="true">🔥 Хіт продажу</option>
      </select>

      <button id="addProductButton">
        Додати товар
      </button>

      <div id="addStatus" class="status">
        Заповни дані товару.
      </div>

    </div>


    <!-- ЗАМОВЛЕННЯ -->
    <div class="box"><h2>🛒 Замовлення</h2><button id="refreshOrdersButton">🔄 Оновити замовлення</button><div id="ordersList">Завантаження замовлень...</div></div>

    <!-- ТОВАРИ -->
    <div class="box">

      <h2>📦 Товари магазину</h2>

      <button id="refreshButton">
        🔄 Оновити список
      </button>

      <div id="productsList">
        Завантаження товарів...
      </div>

    </div>

  </div>

</div>


<script>

  /* =====================================================
     SUPABASE
     ===================================================== */

  const SUPABASE_URL =
    "https://rzdqohedzsgcmhcdhlri.supabase.co";

  /*
    СЮДИ ВСТАВ СВІЙ СПРАВЖНІЙ
    sb_publishable_... КЛЮЧ
  */

  const SUPABASE_KEY =
    "sb_publishable_mErWmopCWbRtyq764qh1_A_rZitmXJZ";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  /* =====================================================
     ЕЛЕМЕНТИ
     ===================================================== */

  const loginBox =
    document.getElementById("loginBox");

  const adminPanel =
    document.getElementById("adminPanel");

  const loginButton =
    document.getElementById("loginButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const refreshButton =
    document.getElementById("refreshButton");

  const addProductButton =
    document.getElementById("addProductButton");

  const loginStatus =
    document.getElementById("loginStatus");

  const addStatus =
    document.getElementById("addStatus");

  const productsList =
    document.getElementById("productsList");

  const userEmail =
    document.getElementById("userEmail");

  const refreshOrdersButton = document.getElementById("refreshOrdersButton");
  const ordersList = document.getElementById("ordersList");


  /* =====================================================
     ПЕРЕВІРКА СЕСІЇ
     ===================================================== */

  async function checkSession() {

    const {
      data: {
        session
      }
    } = await db.auth.getSession();

    if (session) {

      showAdmin(session);

    } else {

      showLogin();

    }
  }


  /* =====================================================
     ПОКАЗАТИ ВХІД
     ===================================================== */

  function showLogin() {

    loginBox.classList.remove("hidden");
    adminPanel.classList.add("hidden");

  }


  /* =====================================================
     ПОКАЗАТИ АДМІНКУ
     ===================================================== */

  function showAdmin(session) {

    loginBox.classList.add("hidden");
    adminPanel.classList.remove("hidden");

    userEmail.textContent =
      "Ви увійшли як: " + session.user.email;

    loadProducts();
    loadOrders();

  }


  /* =====================================================
     ВХІД
     ===================================================== */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      loginStatus.textContent =
        "❌ Введи email та пароль.";

      return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "Вхід...";

    loginStatus.textContent =
      "Перевіряємо дані...";

    try {

      const {
        data,
        error
      } = await db.auth.signInWithPassword({

        email: email,
        password: password

      });

      if (error) {

        console.error(error);

        loginStatus.textContent =
          "❌ " + error.message;

        return;
      }

      if (!data.session) {

        loginStatus.textContent =
          "❌ Сесію не створено.";

        return;
      }

      loginStatus.textContent =
        "✅ Успішний вхід!";

      showAdmin(data.session);

    } catch (error) {

      console.error(error);

      loginStatus.textContent =
        "❌ Помилка: " + error.message;

    } finally {

      loginButton.disabled = false;
      loginButton.textContent = "Увійти";

    }

  }


  /* =====================================================
     ВИХІД
     ===================================================== */

  async function logout() {

    await db.auth.signOut();

    showLogin();

  }


  /* =====================================================
     ДОДАТИ ТОВАР
     ===================================================== */

  async function addProduct() {

    const name =
      document.getElementById("productName")
        .value.trim();

    const price =
      Number(
        document.getElementById("productPrice")
          .value
      );

    const description =
      document.getElementById("productDescription")
        .value.trim();

    const image =
      document.getElementById("productImage")
        .value.trim();

    const category =
      document.getElementById("productCategory")
        .value;

    const available =
      document.getElementById("productAvailable")
        .value === "true";

    const is_hit =
      document.getElementById("productHit")
        .value === "true";


    if (!name) {

      addStatus.textContent =
        "❌ Вкажи назву товару.";

      return;
    }

    if (!price || price <= 0) {

      addStatus.textContent =
        "❌ Вкажи правильну ціну.";

      return;
    }


    addProductButton.disabled = true;
    addProductButton.textContent =
      "Додаємо...";

    addStatus.textContent =
      "Зберігаємо товар...";


    try {

      const {
        data,
        error
      } = await db
        .from("products")
        .insert([{
          name: name,
          price: price,
          description: description,
          image: image,
          category: category,
          available: available,
          is_hit: is_hit
        }])
        .select()
        .single();


      if (error) {

        console.error(error);

        addStatus.textContent =
          "❌ " + error.message;

        return;
      }


      const selectedFiles = Array.from(document.getElementById("productImages").files || []);
      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const path = data.id + "/" + Date.now() + "_" + i + "_" + safeName;
        const upload = await db.storage.from("product-images").upload(path, file, { upsert: false });
        if (upload.error) throw upload.error;
        const publicUrl = db.storage.from("product-images").getPublicUrl(path).data.publicUrl;
        const imageInsert = await db.from("product_images").insert({product_id:data.id,image_url:publicUrl,sort_order:i});
        if(imageInsert.error){ throw new Error("Помилка збереження фото №"+(i+1)+": "+imageInsert.error.message); }
        if(i===0){
          const mainUpdate = await db.from("products").update({image:publicUrl}).eq("id",data.id);
          if(mainUpdate.error){ throw new Error("Фото завантажено, але не вдалося встановити головне фото: "+mainUpdate.error.message); }
        }
        if (imageInsert.error) throw imageInsert.error;
      }

      addStatus.textContent =
        "✅ Товар успішно додано!";


      document.getElementById("productName")
        .value = "";

      document.getElementById("productPrice")
        .value = "";

      document.getElementById("productDescription")
        .value = "";

      document.getElementById("productImage")
        .value = "";
      document.getElementById("productImages").value = "";

      document.getElementById("productCategory")
        .value = "Для дому";

      document.getElementById("productAvailable")
        .value = "true";

      document.getElementById("productHit")
        .value = "false";


      loadProducts();


    } catch (error) {

      console.error(error);

      addStatus.textContent =
        "❌ Помилка: " + error.message;

    } finally {

      addProductButton.disabled = false;
      addProductButton.textContent =
        "Додати товар";

    }

  }


  /* =====================================================
     ЗАВАНТАЖИТИ ТОВАРИ
     ===================================================== */

  async function loadProducts() {

    productsList.innerHTML =
      "⏳ Завантаження...";


    try {

      const {
        data,
        error
      } = await db
        .from("products")
        .select("*")
        .order("id", {
          ascending: false
        });


      if (error) {

        console.error(error);

        productsList.innerHTML =
          "❌ " + error.message;

        return;
      }


      if (!data || data.length === 0) {

        productsList.innerHTML =
          "Поки що товарів немає.";

        return;
      }


      productsList.innerHTML = "";


      data.forEach(product => {

        const div =
          document.createElement("div");

        div.className = "product";


        const imageHTML =
          product.image
            ? `
              <img
                src="${escapeHTML(product.image)}"
                alt="${escapeHTML(product.name)}"
                style="
                  width:100%;
                  max-width:250px;
                  border-radius:10px;
                  margin-bottom:10px;
                "
              >
            `
            : "";


        div.innerHTML = `

          ${imageHTML}

          <h3>
            ${escapeHTML(product.name)}
          </h3>

          <div class="price">
            ${product.price} грн
          </div>

          <p>
            ${escapeHTML(product.description || "")}
          </p>

          <p>
            <b>Категорія:</b>
            ${escapeHTML(product.category || "")}
          </p>

          <p>
            <b>Статус:</b>
            ${
              product.available
                ? "✅ Є в наявності"
                : "❌ Немає в наявності"
            }
          </p>

          ${
            product.is_hit
              ? "<p>🔥 Хіт продажу</p>"
              : ""
          }

          <button
            class="danger"
            onclick="deleteProduct(${product.id})"
          >
            🗑 Видалити
          </button>

        `;


        productsList.appendChild(div);

      });


    } catch (error) {

      console.error(error);

      productsList.innerHTML =
        "❌ Помилка: " + error.message;

    }

  }


  /* =====================================================
     ВИДАЛЕННЯ ТОВАРУ
     ===================================================== */

  async function deleteProduct(id) {

    const confirmDelete =
      confirm(
        "Точно видалити цей товар?"
      );

    if (!confirmDelete) {
      return;
    }


    try {

      const {
        error
      } = await db
        .from("products")
        .delete()
        .eq("id", id);


      if (error) {

        alert(
          "❌ " + error.message
        );

        return;
      }


      alert(
        "✅ Товар видалено."
      );


      loadProducts();


    } catch (error) {

      console.error(error);

      alert(
        "❌ Помилка: " + error.message
      );

    }

  }


  /* =====================================================
     ЗАМОВЛЕННЯ
     ===================================================== */

  async function loadOrders() {
    ordersList.innerHTML = "⏳ Завантаження...";
    const result = await db.from("orders").select("*").order("created_at", {ascending:false});
    if (result.error) { ordersList.innerHTML = "❌ " + escapeHTML(result.error.message); return; }
    const itemResult = await db.from("order_items").select("*");
    const items = itemResult.data || [];
    ordersList.innerHTML = "";
    if (!result.data || !result.data.length) { ordersList.innerHTML = "Замовлень поки немає."; return; }
    result.data.forEach(order => {
      const orderItems = items.filter(x => x.order_id === order.id);
      const div = document.createElement("div");
      div.className = "product";
      const created = order.created_at ? new Date(order.created_at).toLocaleString("uk-UA") : "";
      const itemText = orderItems.map(x => escapeHTML(x.product_name) + " × " + x.quantity + " — " + Number(x.price).toLocaleString("uk-UA") + " грн").join("<br>") || "—";
      div.innerHTML = "<h3>🧾 Замовлення №" + order.id + "</h3>" +
        "<p><b>Дата:</b> " + escapeHTML(created) + "</p>" +
        "<p><b>Клієнт:</b> " + escapeHTML(order.customer_name) + "</p>" +
        "<p><b>Телефон:</b> " + escapeHTML(order.phone) + "</p>" +
        "<p><b>Доставка:</b> " + escapeHTML(order.delivery_method) + "</p>" +
        "<p><b>Місто:</b> " + escapeHTML(order.city || "") + "</p>" +
        "<p><b>Відділення / індекс:</b> " + escapeHTML((order.branch || "") + (order.postal_code ? " / " + order.postal_code : "")) + "</p>" +
        "<p><b>Коментар:</b> " + escapeHTML(order.comment || "—") + "</p>" +
        "<p><b>Товари:</b><br>" + itemText + "</p>" +
        "<p class=\"price\">Разом: " + Number(order.total).toLocaleString("uk-UA") + " грн</p>" +
        "<select onchange=\"updateOrderStatus(" + order.id + ", this.value)\">" +
        "<option value=\"new\" " + (order.status === "new" ? "selected" : "") + ">🆕 Нове</option>" +
        "<option value=\"processing\" " + (order.status === "processing" ? "selected" : "") + ">⚙️ В обробці</option>" +
        "<option value=\"shipped\" " + (order.status === "shipped" ? "selected" : "") + ">🚚 Відправлено</option>" +
        "<option value=\"completed\" " + (order.status === "completed" ? "selected" : "") + ">✅ Виконано</option>" +
        "<option value=\"cancelled\" " + (order.status === "cancelled" ? "selected" : "") + ">❌ Скасовано</option></select>";
      ordersList.appendChild(div);
    });
  }

  async function updateOrderStatus(id, status) {
    const result = await db.from("orders").update({status:status}).eq("id", id);
    if (result.error) { alert("❌ " + result.error.message); return; }
    loadOrders();
  }


  /* =====================================================
     ЗАХИСТ ВІД HTML
     ===================================================== */

  function escapeHTML(value) {

    if (value === null ||
        value === undefined) {

      return "";

    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =====================================================
     КНОПКИ
     ===================================================== */

  loginButton.addEventListener(
    "click",
    login
  );

  logoutButton.addEventListener(
    "click",
    logout
  );

  refreshButton.addEventListener(
    "click",
    loadProducts
  );

  addProductButton.addEventListener(
    "click",
    addProduct
  );

  refreshOrdersButton.addEventListener(
    "click",
    loadOrders
  );


  /* =====================================================
     ENTER ДЛЯ ВХОДУ
     ===================================================== */

  document
    .getElementById("password")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          login();
        }

      }
    );


  /* =====================================================
     СТАРТ
     ===================================================== */

  checkSession();

</script>

</body>
</html>
